url: "https://cremacozy-glitch.github.io"
baseurl: "/cremacozy"
permalink: /:title/
# Put your public contact email below (inside the quotes). Used on the Contact and Privacy pages.
email: ""
amazon_tag: "crate137icg-20"
plugins:
